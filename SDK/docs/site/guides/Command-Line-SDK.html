<!doctype html><meta charset="utf-8"><title>Inu command-line SDK</title><h1>Inu command-line SDK</h1><p>The canonical <code>inu</code> executable is the only command authority.</p><ul><li><code>inu build [--root &lt;path&gt;] [--force-rebuild]</code></li><li><code>inu toolchain ensure [--root &lt;path&gt;]</code></li><li><code>inu version</code> (aliases: <code>--version</code>, <code>-v</code>)</li><li><code>inu help</code> (aliases: <code>--help</code>, <code>-h</code>)</li></ul><p>No other command is part of the supported CLI API.</p>
